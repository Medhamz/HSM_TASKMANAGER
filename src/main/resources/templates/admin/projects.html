<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"><title>Projects</title></head>
<body th:replace="~{layout :: body}">
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center">
        <h2>Projects</h2>
        <a href="/admin/projects/new" class="btn btn-primary">+ New Project</a>
    </div>
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Tests Count</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${projects}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.name}">Name</td>
            <td th:text="${p.startDate}">Start</td>
            <td th:text="${p.endDate}">End</td>
            <td th:text="${p.testClasses.size()}">0</td>
            <td>
                <a th:href="@{/admin/projects/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/admin/projects/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this project?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
