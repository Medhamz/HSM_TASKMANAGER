<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"><title>Project Form</title></head>
<body th:replace="~{layout :: body}">
<div th:fragment="content">
    <h2 th:text="${project.id} ? 'Edit Project' : 'New Project'">Form</h2>
    <form th:action="@{/admin/projects/save}" th:object="${project}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
            <div class="text-danger" th:errors="*{name}">Error</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" th:field="*{startDate}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">End Date</label>
            <input type="date" th:field="*{endDate}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/admin/projects" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
