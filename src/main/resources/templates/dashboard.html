<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}">
    <title>Dashboard</title>
</head>
<body th:replace="~{layout :: body}">
<div th:fragment="content">
    <h2>Dashboard</h2>
    <p>Welcome, <span sec:authentication="name"></span>!</p>

    <!-- Statistiques rapides -->
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Total Tests</h5>
                    <p class="card-text display-6" th:text="${totalTests}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Completed</h5>
                    <p class="card-text display-6" th:text="${statusStats['COMPLETED']}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                    <h5 class="card-title">In Progress</h5>
                    <p class="card-text display-6" th:text="${statusStats['IN_PROGRESS']}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-danger mb-3">
                <div class="card-body">
                    <h5 class="card-title">Suspended</h5>
                    <p class="card-text display-6" th:text="${statusStats['SUSPENDED']}">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Graphiques -->
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Status Distribution</div>
                <div class="card-body">
                    <canvas id="statusChart" width="400" height="300"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Test Type Distribution</div>
                <div class="card-body">
                    <canvas id="typeChart" width="400" height="300"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue par semaines -->
    <div class="mt-5">
        <h3>Weekly View</h3>
        <div th:each="entry : ${testsByWeek}">
            <div class="card mt-3">
                <div class="card-header">
                    <strong>Week: <span th:text="${entry.key}">2026-W32</span></strong>
                    <span class="badge bg-secondary float-end" th:text="${entry.value.size()} + ' tests'"></span>
                </div>
                <div class="card-body">
                    <table class="table table-sm table-striped">
                        <thead>
                        <tr>
                            <th>Test Class</th>
                            <th>Project</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Start Date</th>
                            <th>Est. Hours</th>
                            <th>Completion Date</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="test : ${entry.value}">
                            <td th:text="${test.name}">Name</td>
                            <td th:text="${test.project.name}">Project</td>
                            <td th:text="${test.type}">Type</td>
                            <td><span class="badge" th:classappend="${test.status == 'COMPLETED' ? 'bg-success' : test.status == 'IN_PROGRESS' ? 'bg-warning' : test.status == 'SUSPENDED' ? 'bg-danger' : 'bg-secondary'}" th:text="${test.status}">Status</span></td>
                            <td th:text="${#temporals.format(test.startDate, 'dd/MM/yyyy')}">Date</td>
                            <td th:text="${test.estimatedHours}">Hours</td>
                            <td th:text="${test.completionDate != null ? #temporals.format(test.completionDate, 'dd/MM/yyyy') : '-'}">Date</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== CHATBOT INTÉGRÉ ====== -->
    <div id="chatbotContainer" style="position: fixed; bottom: 20px; right: 20px; z-index: 999;">
        <!-- Bouton pour ouvrir/fermer -->
        <button id="chatbotToggle" class="btn btn-primary rounded-circle" style="width:60px;height:60px;font-size:28px;box-shadow:0 4px 15px rgba(0,0,0,0.3);">
            <i class="fas fa-robot"></i>
        </button>
        <!-- Fenêtre du chatbot -->
        <div id="chatbotWindow" style="display:none; position:absolute; bottom:70px; right:0; width:320px; background:var(--card-bg); border-radius:15px; box-shadow:0 10px 40px rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1);">
            <div style="background:linear-gradient(135deg, #3498db, #2980b9); color:white; border-radius:15px 15px 0 0; padding:12px 18px; font-weight:600; display:flex; justify-content:space-between; align-items:center;">
                <span><i class="fas fa-robot me-2"></i>Task Assistant</span>
                <span id="chatbotClose" style="cursor:pointer;">&times;</span>
            </div>
            <div style="height:300px; display:flex; flex-direction:column;">
                <div id="chatMessages" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:8px;"></div>
                <div class="input-group">
                    <input type="text" id="chatInput" class="form-control" placeholder="Ask something..." style="border-radius:0 0 0 15px;">
                    <button id="chatSend" class="btn btn-primary" style="border-radius:0 0 15px 0;"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // Graphiques
        const statusData = /*[[${statusStats}]]*/ {};
        const typeData = /*[[${typeStats}]]*/ {};

        new Chart(document.getElementById('statusChart'), {
            type: 'pie',
            data: {
                labels: Object.keys(statusData),
                datasets: [{
                    data: Object.values(statusData),
                    backgroundColor: ['#6c757d', '#ffc107', '#dc3545', '#28a745']
                }]
            }
        });

        new Chart(document.getElementById('typeChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(typeData),
                datasets: [{
                    label: 'Number of tests',
                    data: Object.values(typeData),
                    backgroundColor: ['#0d6efd', '#d63384']
                }]
            }
        });

        // ===== CHATBOT =====
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('chatbotToggle');
            const windowDiv = document.getElementById('chatbotWindow');
            const closeBtn = document.getElementById('chatbotClose');
            const sendBtn = document.getElementById('chatSend');
            const input = document.getElementById('chatInput');
            const messages = document.getElementById('chatMessages');

            toggleBtn.addEventListener('click', function() {
                const isOpen = windowDiv.style.display === 'block';
                windowDiv.style.display = isOpen ? 'none' : 'block';
                if (!isOpen) input.focus();
            });
            closeBtn.addEventListener('click', function() {
                windowDiv.style.display = 'none';
            });

            function appendMessage(cls, text) {
                const div = document.createElement('div');
                div.className = cls;
                div.textContent = text;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
            }

            function sendMessage() {
                const text = input.value.trim();
                if (!text) return;
                appendMessage('user-msg', text);
                input.value = '';
                setTimeout(() => {
                    let response = "I'm here to help! You can ask about tasks, status, or deadlines.";
                    const lower = text.toLowerCase();
                    if (lower.includes('hello') || lower.includes('hi')) {
                        response = "Hello! How can I assist you with your tasks today?";
                    } else if (lower.includes('status')) {
                        response = "You can view task statuses in the dashboard. Currently, we have tasks in progress, completed, and suspended.";
                    } else if (lower.includes('deadline')) {
                        response = "Deadlines are displayed in the task list. You can sort by completion date.";
                    }
                    appendMessage('bot-msg', response);
                }, 500);
            }

            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });

            // Message de bienvenue
            setTimeout(() => {
                appendMessage('bot-msg', "👋 Hi! I'm your task assistant. Ask me anything about your tasks.");
            }, 1000);
        });
        /*]]>*/
    </script>
</div>
</body>
</html>
