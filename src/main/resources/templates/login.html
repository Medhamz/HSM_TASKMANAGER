<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="vLi-8dM_9h7nijPercejh2UtzM51fAzZrGhztIaQxQE" />
    <title>HSM Task Manager - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #2d1b69 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-wrapper {
            width: 100%;
            max-width: 450px;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 48px 40px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
            transition: transform 0.4s ease;
        }
        .login-card:hover { transform: translateY(-6px); }
        .login-card .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-card .logo i {
            font-size: 52px;
            background: linear-gradient(135deg, #6c63ff, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card .logo h2 {
            font-weight: 700;
            font-size: 28px;
            margin-top: 10px;
            background: linear-gradient(135deg, #6c63ff, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card .form-control {
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 14px 18px;
            color: #fff;
            transition: all 0.3s;
        }
        .login-card .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .login-card .form-control:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.2);
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .login-card .btn-primary {
            background: linear-gradient(135deg, #6c63ff, #00d2ff);
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        .login-card .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(108, 99, 255, 0.4);
        }
        .login-card .text-muted {
            color: rgba(255,255,255,0.5) !important;
        }
        .login-card .alert {
            border-radius: 12px;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }
        .login-card .alert-info {
            background: rgba(46, 204, 113, 0.15);
            border-color: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }
        .login-card .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.3);
        }
        .login-card .footer-text i {
            color: #e74c3c;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(108, 99, 255, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="login-wrapper" style="position:relative; z-index:1;">
    <div class="login-card">
        <div class="logo">
            <i class="fas fa-tasks"></i>
            <h2>HSM Task Manager</h2>
            <p class="text-muted" style="font-size:0.9rem;">Sign in to your account</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label text-light">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>

            <div th:if="${param.error}" class="alert mt-3">
                <i class="fas fa-exclamation-circle me-2"></i> Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-info mt-3">
                <i class="fas fa-check-circle me-2"></i> You have been logged out.
            </div>
        </form>

        <div class="footer-text">
            <i class="fas fa-lock"></i> Secure connection • HSM © 2026
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 6 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 20 + 15) + 's';
            particle.style.animationDelay = (Math.random() * 20) + 's';
            container.appendChild(particle);
        }
    });
</script>
</body>
</html>
