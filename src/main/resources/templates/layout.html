<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSM Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-tasks me-2"></i>HSM Task Manager
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-chart-pie me-1"></i>Dashboard</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/projects"><i class="fas fa-folder me-1"></i>Projects</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/tests"><i class="fas fa-flask me-1"></i>Test Classes</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <button class="btn btn-outline-light btn-sm me-2" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-link nav-link"
                                style="display: inline; padding: 0; border: none; background: none; color: rgba(255,255,255,0.55);">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:replace="~{::content}">Content</div>
</div>

<!-- ============ CHATBOT ============ -->
<!-- Bouton du chatbot -->
<button id="chatbotButton" class="btn btn-primary rounded-circle">
    <i class="fas fa-robot"></i>
</button>

<!-- Fenêtre du chatbot -->
<div id="chatbot">
    <div id="chatbot-header">
        <span><i class="fas fa-robot me-2"></i>Task Assistant</span>
        <span class="close-btn" id="chatbotClose">&times;</span>
    </div>
    <div id="chatbot-body" style="display:flex;flex-direction:column;">
        <div id="chatMessages"></div>
        <div class="input-group">
            <input type="text" id="chatInput" class="form-control" placeholder="Ask something...">
            <button id="chatSend" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/chatbot.js}"></script>

<!-- Script du thème (basculer dark/light) -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Restaurer le thème
        const saved = localStorage.getItem('theme');
        if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
        }
        // Toggle
        const btn = document.getElementById('themeToggle');
        if (btn) {
            btn.addEventListener('click', function() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                // Changer l'icône
                const icon = this.querySelector('i');
                if (icon) {
                    icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                }
            });
        }
        // Initialiser l'icône du bouton thème
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const icon = themeBtn.querySelector('i');
            if (icon) {
                icon.className = currentTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }
    });
</script>
</body>
</html>
