<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSM Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">HSM Task Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/projects">Projects</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/tests">Test Classes</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-link nav-link"
                                style="display: inline; padding: 0; border: none; background: none; color: rgba(255,255,255,0.55);">
                            Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div th:replace="~{::content}">Content</div>
</div>

<!-- Chatbot Button -->
<button id="chatbotButton" class="btn btn-primary rounded-circle" style="position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;font-size:28px;z-index:1000;box-shadow:0 4px 15px rgba(0,0,0,0.3);">
    <i class="fas fa-robot"></i>
</button>

<!-- Chatbot Window -->
<div id="chatbot" style="position:fixed;bottom:80px;right:20px;width:320px;background:var(--card-bg);border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,0.4);display:none;z-index:999;border:1px solid rgba(255,255,255,0.1);">
    <div id="chatbot-header" style="background:linear-gradient(135deg, var(--primary), #2980b9);color:white;border-radius:15px 15px 0 0;padding:12px 18px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;">
        <span><i class="fas fa-robot me-2"></i>Task Assistant</span>
        <span id="chatbotClose" style="cursor:pointer;">&times;</span>
    </div>
    <div id="chatbot-body" style="height:350px;display:flex;flex-direction:column;">
        <div id="chatMessages" style="flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;"></div>
        <div class="input-group">
            <input type="text" id="chatInput" class="form-control" placeholder="Ask something..." style="border:none;border-top:1px solid #ddd;border-radius:0 0 0 15px;padding:12px 15px;background:var(--card-bg);color:var(--text-color);">
            <button id="chatSend" class="btn btn-primary" style="border-radius:0 0 15px 0;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/chatbot.js}"></script>
</body>
</html>
