<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSM Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(90deg, #1a2a6c, #2d4373) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
        }
        .card {
            border-radius: 15px;
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15) !important;
        }
        .btn {
            border-radius: 25px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(45deg, #1a2a6c, #2d4373);
            border: none;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(26, 42, 108, 0.3);
        }
        .btn-success {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
        }
        .badge {
            font-weight: 500;
            padding: 6px 12px;
        }
        .table thead th {
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(26, 42, 108, 0.05);
        }
        .week-card {
            border-left: 5px solid #1a2a6c;
            margin-bottom: 20px;
            background: white;
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .week-title {
            font-weight: 700;
            color: #1a2a6c;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        .week-title i {
            margin-right: 10px;
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
        }
        /* Chatbot widget */
        .chatbot-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(45deg, #1a2a6c, #2d4373);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s ease;
            border: none;
        }
        .chatbot-toggle:hover {
            transform: scale(1.1);
        }
        .chatbot-window {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 350px;
            max-height: 450px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            z-index: 999;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .chatbot-header {
            background: linear-gradient(90deg, #1a2a6c, #2d4373);
            color: white;
            padding: 15px 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chatbot-header .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .chatbot-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            max-height: 300px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 14px;
            border-radius: 20px;
            max-width: 80%;
        }
        .message.bot {
            background: #e9ecef;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .message.user {
            background: #1a2a6c;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
            margin-left: auto;
        }
        .chatbot-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #dee2e6;
            background: white;
        }
        .chatbot-input input {
            flex: 1;
            border: 1px solid #ced4da;
            border-radius: 25px;
            padding: 8px 15px;
            outline: none;
        }
        .chatbot-input button {
            background: #1a2a6c;
            border: none;
            color: white;
            border-radius: 25px;
            padding: 8px 20px;
            margin-left: 10px;
            cursor: pointer;
        }
        @media (max-width: 576px) {
            .chatbot-window {
                width: 90%;
                right: 5%;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard"><i class="fas fa-tasks me-2"></i>HSM Task Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-chart-pie me-1"></i>Dashboard</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/projects"><i class="fas fa-folder me-1"></i>Projects</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/tests"><i class="fas fa-flask me-1"></i>Test Classes</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-link nav-link" style="display: inline; padding: 0; border: none; background: none; color: rgba(255,255,255,0.7);">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:replace="~{::content}">Content</div>
</div>

<!-- Chatbot Widget -->
<div class="chatbot-toggle" id="chatbotToggle">
    <i class="fas fa-robot"></i>
</div>
<div class="chatbot-window" id="chatbotWindow">
    <div class="chatbot-header">
        <span><i class="fas fa-robot me-2"></i>HSM Assistant</span>
        <button class="close-btn" id="chatbotClose">&times;</button>
    </div>
    <div class="chatbot-messages" id="chatMessages">
        <div class="message bot">Bonjour ! Je suis l'assistant HSM. Posez-moi des questions sur vos tâches.</div>
    </div>
    <div class="chatbot-input">
        <input type="text" id="chatInput" placeholder="Votre message...">
        <button id="chatSend"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/chatbot.js"></script>
</body>
</html>
